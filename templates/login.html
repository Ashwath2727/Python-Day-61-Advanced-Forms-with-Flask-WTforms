<!DOCTYPE html>

<html>
    <head>
        <title>Login</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <h1>Login</h1>
            <!-- This is where our form will go. -->
            <form method="post" action="{{ url_for("login") }}">
				{{ form.csrf_token }}
				{{ form.email.label }} {{ form.email }} <br><br>
				{{ form.password.label }} {{ form.password }} <br><br>

				{{ form.submit}}
			</form>
        </div>

		</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
